plugins { id 'com.android.application' }

dependencies { implementation 'androidx.exifinterface:exifinterface:1.4.2' }

def signingFile = rootProject.file('../.signing/release.properties')
def releaseKeys = new Properties()
if (signingFile.exists()) signingFile.withInputStream { releaseKeys.load(it) }

android {
    namespace 'cn.weeazn.bilifans'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.weeazn.bilifans'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '1.4.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('../.signing/bilifans-release.jks')
                storePassword releaseKeys.getProperty('storePassword')
                keyAlias 'bilifans'
                keyPassword releaseKeys.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/dashboard')
}

tasks.register('syncDashboard', Copy) {
    from '../../index.html'
    into layout.buildDirectory.dir('generated/dashboard')
}
tasks.named('preBuild').configure { dependsOn 'syncDashboard' }
